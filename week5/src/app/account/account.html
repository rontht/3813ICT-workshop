<div class="d-flex justify-content-center align-items-center min-vh-100 bg-light">
    <div class="card text-center shadow-lg bg-primary rounded-4 w-25">
        <div class="card-body p-4 text-white">

            <h2 class="mb-4">My Account</h2>

            <!-- Read-only view -->
            <div *ngIf="!editing">
                <p><strong>Username:</strong> {{ user.username }}</p>
                <p><strong>Email:</strong> {{ user.email }}</p>
                <p><strong>Birthdate:</strong> {{ user.birthdate }}</p>
                <p><strong>Age:</strong> {{ user.age }}</p>
                <div class="d-flex gap-2">
                    <button class="btn btn-lg w-100 rounded-3 bg-info" (click)="startEdit()">Edit</button>
                    <button class="btn btn-lg w-100 rounded-3 btn-danger" (click)="logout()">Logout</button>
                </div>
            </div>

            <!-- Edit form -->
            <form *ngIf="editing" (ngSubmit)="update()">
                <div class="mb-3 text-start">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-control form-control-lg rounded-3" [(ngModel)]="temp_data.username"
                        name="username" />
                </div>

                <div class="mb-3 text-start">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control form-control-lg rounded-3" [(ngModel)]="temp_data.email"
                        name="email" />
                </div>

                <div class="mb-3 text-start">
                    <label class="form-label">Birthdate</label>
                    <input type="date" class="form-control form-control-lg rounded-3" [(ngModel)]="temp_data.birthdate"
                        name="birthdate" />
                </div>

                <div class="mb-3 text-start">
                    <label class="form-label">Age</label>
                    <input type="number" class="form-control form-control-lg rounded-3" [(ngModel)]="temp_data.age"
                        name="age" />
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-lg w-100 rounded-3 bg-info">Update</button>
                    <button type="button" class="btn btn-lg w-100 rounded-3 btn-outline-light"
                        (click)="cancel()">Cancel</button>
                </div>
            </form>

        </div>
    </div>
</div>
