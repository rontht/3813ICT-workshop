<div class="d-flex justify-content-center align-items-center min-vh-100 bg-light">
  <div class="card text-center shadow-lg border-0 bg-primary rounded-4">
    <div class="card-body p-4 text-white">

      <h2 class="mb-4">Login</h2>

      <form (ngSubmit)="onLogin()">
        <div class="mb-3">
          <input
            type="email"
            [(ngModel)]="email"
            name="email"
            class="form-control form-control-lg rounded-3"
            placeholder="Email"
            required
          />
        </div>

        <div class="mb-3">
          <input
            type="password"
            [(ngModel)]="password"
            name="password"
            class="form-control form-control-lg rounded-3"
            placeholder="Password"
            required
          />
        </div>

        <button type="submit" class="btn btn-lg w-100 rounded-3 bg-info">
          Login
        </button>
      </form>

      <!-- Error message -->
      <div *ngIf="loginError" class="alert alert-danger mt-3 p-2 rounded-3">
        {{loginError}}
      </div>
    </div>
  </div>
</div>
